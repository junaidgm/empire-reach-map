<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <radialGradient id="globeGradient" cx="35%" cy="35%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ff1744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c62828;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="shadowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.3" />
    </radialGradient>
  </defs>

  <!-- Globe sphere -->
  <circle cx="100" cy="100" r="85" fill="url(#globeGradient)" stroke="#8b0000" stroke-width="2"/>

  <!-- Continents/landmasses (simplified) -->
  <!-- North America -->
  <path d="M 60 70 Q 55 80, 60 90 L 75 85 Q 70 75, 60 70" fill="#5c0000" opacity="0.6"/>

  <!-- South America -->
  <path d="M 70 95 Q 68 110, 75 125 L 82 120 Q 80 105, 75 95" fill="#5c0000" opacity="0.6"/>

  <!-- Europe/Africa -->
  <path d="M 100 65 Q 110 70, 115 85 Q 120 100, 115 115 Q 108 110, 105 95 Q 102 80, 100 65" fill="#5c0000" opacity="0.6"/>

  <!-- Asia -->
  <path d="M 120 75 Q 135 78, 140 95 Q 138 110, 125 115 Q 120 105, 120 75" fill="#5c0000" opacity="0.6"/>

  <!-- Shadow/depth effect -->
  <circle cx="100" cy="100" r="85" fill="url(#shadowGradient)" stroke="none"/>

  <!-- Highlight for dimension -->
  <ellipse cx="70" cy="65" rx="30" ry="25" fill="#ff8a80" opacity="0.3"/>

  <!-- Crosshair lines (longitude/latitude) -->
  <line x1="100" y1="20" x2="100" y2="180" stroke="#ffcccc" stroke-width="1.5" opacity="0.4"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#ffcccc" stroke-width="1.5" opacity="0.4"/>

  <!-- Decorative ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#8b0000" stroke-width="1" opacity="0.5" stroke-dasharray="5,5"/>
</svg>